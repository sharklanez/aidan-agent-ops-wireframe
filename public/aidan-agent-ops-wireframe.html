.form-select {

  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  background-color: var(--secondary);

.form-check {

  align-items: center;
  gap: 6px;

.form-check-input {

  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

  border-color: var(--primary);

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);

  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;

          &lt;div data-wizard-step=&quot;4&quot; hidden&gt;&lt;h3&gt;Run a sandbox test&lt;/h3&gt;&lt;p class=&quot;aw-small aw-muted&quot; style=&quot;margin:5px 0 14px&quot;&gt;Use copied data; no emails are sent and no records are changed.&lt;/p&gt;&lt;div class=&quot;aw-evidence&quot;&gt;&lt;strong&gt;Test passed.&lt;/strong&gt; The agent qualified the lead, drafted a policy-compliant reply, paused at the 18% discount gate, and produced a complete audit record.&lt;/div&gt;&lt;div class=&quot;aw-detail-grid&quot;&gt;&lt;div class=&quot;aw-detail-cell&quot;&gt;&lt;span&gt;Projected monthly volume&lt;/span&gt;&lt;strong&gt;600–750 runs&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;aw-detail-cell&quot;&gt;&lt;span&gt;Estimated operating cost&lt;/span&gt;&lt;strong&gt;$320–$460/month&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById('aidan-orchestrator-wireframe');
      if (!root) return;
      const screens = Array.from(root.querySelectorAll('[data-screen]'));
      const navButtons = Array.from(root.querySelectorAll('[data-screen-target]'));
      const roleSelect = root.querySelector('#aw-role');
      const primaryAction = root.querySelector('#aw-primary-action');
      const primaryLabel = primaryAction.querySelector('span');
      const wizard = root.querySelector('#aw-wizard');
      const toast = root.querySelector('#aw-toast');
      let wizardStep = 1;
      let approvalCount = 3;

      function showScreen(name) {
        screens.forEach((screen) =&gt; { screen.hidden = screen.dataset.screen !== name; });
        navButtons.forEach((button) =&gt; {
          if (button.dataset.screenTarget === name &amp;&amp; !button.hidden) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
      }

      function flash(message) {
        toast.textContent = message;
        toast.hidden = false;
        window.setTimeout(() =&gt; { toast.hidden = true; }, 2600);
      }

      function setRole(role) {
        const admin = role === 'admin';
        root.querySelectorAll('.admin-role').forEach((item) =&gt; { item.hidden = !admin; });
        root.querySelectorAll('.employee-role').forEach((item) =&gt; { item.hidden = admin; });
        primaryLabel.textContent = admin ? 'Deploy workflow' : 'New request';
        showScreen(admin ? 'overview' : 'employee-home');
      }

      function updateWizard() {
        root.querySelectorAll('[data-wizard-step]').forEach((panel) =&gt; { panel.hidden = Number(panel.dataset.wizardStep) !== wizardStep; });
        root.querySelectorAll('[data-step-indicator]').forEach((indicator) =&gt; {
          const step = Number(indicator.dataset.stepIndicator);
          indicator.classList.toggle('is-active', step === wizardStep);
          indicator.classList.toggle('is-done', step &lt; wizardStep);
        });
        root.querySelector('#aw-wizard-back').disabled = wizardStep === 1;
        root.querySelector('#aw-wizard-next').textContent = wizardStep === 4 ? 'Launch workflow' : 'Continue';
        root.querySelector('#aw-step-copy').textContent = `Step ${wizardStep} of 4`;
      }

      function openWizard() {
        wizardStep = 1;
        updateWizard();
        wizard.hidden = false;
        root.querySelector('#aw-close-wizard').focus();
      }

      navButtons.forEach((button) =&gt; button.addEventListener('click', () =&gt; showScreen(button.dataset.screenTarget)));
      root.querySelectorAll('[data-jump]').forEach((button) =&gt; button.addEventListener('click', () =&gt; showScreen(button.dataset.jump)));
      root.querySelectorAll('[data-open-wizard]').forEach((button) =&gt; button.addEventListener('click', openWizard));
      root.querySelector('[data-edit-workflow]').addEventListener('click', () =&gt; flash('Runbook opened below.'));
      roleSelect.addEventListener('change', () =&gt; setRole(roleSelect.value));
      primaryAction.addEventListener('click', () =&gt; {
        if (roleSelect.value === 'admin') openWizard();
        else showScreen('request');
      });

      root.querySelector('#aw-close-wizard').addEventListener('click', () =&gt; { wizard.hidden = true; });
      root.querySelector('#aw-wizard-back').addEventListener('click', () =&gt; { if (wizardStep &gt; 1) { wizardStep -= 1; updateWizard(); } });
      root.querySelector('#aw-wizard-next').addEventListener('click', () =&gt; {
        if (wizardStep &lt; 4) { wizardStep += 1; updateWizard(); return; }
        wizard.hidden = true;
        showScreen('workflows');
        flash('Lead Recovery workflow launched with approval gates on.');
      });
      root.querySelectorAll('.aw-template').forEach((template) =&gt; template.addEventListener('click', () =&gt; {
        root.querySelectorAll('.aw-template').forEach((item) =&gt; item.classList.remove('is-selected'));
        template.classList.add('is-selected');
      }));

      root.querySelectorAll('[data-approval-action]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const result = button.dataset.approvalAction;
        if (approvalCount &gt; 0) approvalCount -= 1;
        root.querySelectorAll('[data-approval-count]').forEach((node) =&gt; { node.textContent = String(approvalCount); });
        root.querySelectorAll('[data-approval-action]').forEach((action) =&gt; { action.disabled = true; });
        flash(`Decision recorded: ${result}. The agent and audit log were updated.`);
      }));

      root.querySelectorAll('[data-connection]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        button.textContent = 'Connected';
        button.disabled = true;
        flash(`${button.dataset.connection} connection verified.`);
      }));

      root.querySelectorAll('[data-quick-request]').forEach((button) =&gt; button.addEventListener('click', () =&gt; {
        const field = root.querySelector('#aw-request-text');
        field.value = button.dataset.quickRequest;
        showScreen('request');
        field.focus();
      }));

      root.querySelector('#aw-review-plan').addEventListener('click', () =&gt; {
        const value = root.querySelector('#aw-request-text').value.trim();
        if (!value) { flash('Describe the outcome first.'); return; }
        root.querySelector('#aw-request-plan').innerHTML = '&lt;div class=&quot;aw-panel-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;aw-badge aw-badge-good&quot;&gt;Plan ready&lt;/span&gt;&lt;h2 style=&quot;margin-top:10px&quot;&gt;Weekly Reporting Agent&lt;/h2&gt;&lt;p class=&quot;aw-small aw-muted&quot; style=&quot;margin-top:4px&quot;&gt;Approved runbook · Estimated cost $0.80 · No external sends&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;aw-check-list&quot;&gt;&lt;div class=&quot;aw-check-row&quot;&gt;&lt;span&gt;&lt;strong&gt;Read:&lt;/strong&gt; Assigned CRM pipeline and activity records&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aw-check-row&quot;&gt;&lt;span&gt;&lt;strong&gt;Produce:&lt;/strong&gt; A concise brief with risks, stalled deals, and next actions&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;aw-check-row&quot;&gt;&lt;span&gt;&lt;strong&gt;Deliver:&lt;/strong&gt; My work by the selected deadline&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;aw-button aw-button-primary&quot; type=&quot;button&quot; id=&quot;aw-start-request&quot; style=&quot;margin-top:14px;width:100%&quot;&gt;Start request&lt;/button&gt;';
        root.querySelector('#aw-start-request').addEventListener('click', () =&gt; { showScreen('employee-home'); flash('Request started. Progress is now visible in My work.'); });
      });

      updateWizard();
      showScreen('overview');
    })();
  &lt;/script&gt;
&lt;/div&gt;

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
